<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ห้องทดลองตัวเก็บประจุ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Sarabun:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* ทีวี/คอม: พอดีจอเดียว · โทรศัพท์: ภาพบน ปุ่มล่าง */
:root{
  --f-display:"Chakra Petch","Sarabun",system-ui,sans-serif;
  --f-body:"Sarabun",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --u:clamp(13px,1.9vh,40px);
  --bg:#e9eeec; --panel:#f8faf9; --ink:#16232a; --muted:#4d5f64; --line:#c3cfcd;
  --accent:#0d6e66; --accent-ink:#fff;
  --pos:#d42a2a; --neg:#2557d6; --ask:#c98a04; --metal1:#eef2f3; --metal2:#9fb0b6;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden}
body{font-family:var(--f-body);font-size:var(--u);line-height:1.4;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
.app{height:100vh;height:100dvh;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;gap:calc(var(--u)*.6);
  padding:calc(var(--u)*.7) calc(var(--u)*1) calc(var(--u)*.7 + env(safe-area-inset-bottom))}

/* แถบบน */
.bar{display:flex;align-items:center;gap:calc(var(--u)*.6);flex-wrap:wrap}
.back{font-family:var(--f-display);font-weight:600;font-size:calc(var(--u)*.8);color:var(--accent);text-decoration:none;opacity:.85;white-space:nowrap}
h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:calc(var(--u)*1.4);white-space:nowrap}
.tabs{display:flex;gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{font-family:var(--f-display);font-weight:600;font-size:calc(var(--u)*.85);border:0;background:transparent;color:var(--muted);
  padding:.3em .7em;border-radius:9px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.tabs button[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.spacer{flex:1}
.tools{display:flex;gap:calc(var(--u)*.45);flex-wrap:wrap;align-items:center}
.btn{font-family:var(--f-display);font-weight:600;font-size:calc(var(--u)*.95);padding:.35em .8em;border-radius:10px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);cursor:pointer;white-space:nowrap;min-height:2.3em}
.btn:disabled{opacity:.4;cursor:default}
.btn.on{border-color:var(--accent);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:#e3f1ef}
.btn:focus-visible,.tabs button:focus-visible,.seg button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg button{white-space:nowrap;font-family:var(--f-display);font-weight:700;font-size:calc(var(--u)*.95);padding:.35em .75em;border:0;background:var(--panel);color:var(--muted);cursor:pointer;min-height:2.3em}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"].p{background:var(--pos);color:#fff}
.seg button[aria-pressed="true"].n{background:var(--neg);color:#fff}

/* เวที */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;min-width:0;min-height:0;position:relative;overflow:hidden}
.stage canvas{display:block;width:100%;height:100%;touch-action:none}
.toast{position:absolute;bottom:.8em;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.35em .9em;border-radius:999px;
  font-size:calc(var(--u)*.85);opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:.92}

/* ส่วนล่าง */
.bottom{display:grid;grid-template-columns:minmax(0,2.6fr) minmax(0,1fr);gap:calc(var(--u)*.6)}
.bottom .panel{padding:calc(var(--u)*.6) calc(var(--u)*.9);display:grid;gap:calc(var(--u)*.35);align-content:center}
.label{font-family:var(--f-display);font-weight:600;font-size:calc(var(--u)*.75);letter-spacing:.06em;color:var(--muted)}
.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.3em .9em;margin:0}
.nums div{display:grid}
.nums dt{font-size:calc(var(--u)*.78);color:var(--muted)}
.nums dd{margin:0;font-family:var(--f-display);font-weight:700;font-size:calc(var(--u)*1.1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nums .cnt{font-family:var(--f-mono);font-size:calc(var(--u)*1.4)}
.nums .big dd{font-family:var(--f-mono);font-size:calc(var(--u)*1.5)}
.nums .big dd small{font-family:var(--f-body);font-weight:500;font-size:.5em;color:var(--muted);margin-left:.4em}
.legend{display:grid;gap:.4em;font-size:calc(var(--u)*.85)}
.legend span{display:flex;align-items:center;gap:.5em}
.legend b{display:inline-grid;place-items:center;width:1.3em;height:1.3em;border-radius:50%;font-family:var(--f-mono);font-size:.95em;flex:none}
.lp{color:var(--pos);border:1.5px solid var(--pos)}
.ln{background:var(--neg);color:#fff}


/* แท็บ */
[hidden]{display:none!important}
.seg button[aria-pressed="true"].g{background:var(--accent);color:#fff}
.otab{width:100%;border-collapse:collapse;font-size:calc(var(--u)*.9)}
.otab th{font-family:var(--f-display);font-weight:600;font-size:calc(var(--u)*.8);color:var(--muted);text-align:right;padding:0 .5em .15em}
.otab th:first-child,.otab td:first-child{text-align:left;padding-left:0}
.otab td{font-family:var(--f-mono);font-weight:700;font-size:calc(var(--u)*1.1);text-align:right;padding:.05em .5em;white-space:nowrap}
.otab td:first-child{font-family:var(--f-display);font-weight:600;font-size:calc(var(--u)*.95)}
.otab .cp{color:var(--pos)}.otab .cn{color:var(--neg)}
.otab tr.sum td{border-top:1px solid var(--line);padding-top:.15em}
/* หน้าจอเล็ก (คอมจอเล็ก) */
@media (max-width:1600px) and (min-width:761px){h1{display:none}}
/* โทรศัพท์ / แท็บเล็ตแนวตั้ง */
@media (max-width:760px){
  :root{--u:15px}
  html,body{overflow:auto;height:auto}
  .app{height:auto;min-height:100dvh;grid-template-rows:auto 52vh auto;padding:10px 10px calc(10px + env(safe-area-inset-bottom))}
  .bar{gap:8px}
  h1{font-size:18px;flex:1}
  .tabs{order:3;width:100%}
  .spacer{display:none}
  .tools{order:4;width:100%}
  .tools .btn{flex:1 1 auto;padding:.35em .5em;font-size:14px}
  .tools .seg{flex:1 1 auto}.tools .seg button{flex:1}
  .bottom{grid-template-columns:minmax(0,1fr);gap:8px}
  .bottom .legendbox{display:none}
  .nums{grid-template-columns:repeat(2,minmax(0,1fr))}
  .nums .big{grid-column:1/-1}
}
@media (max-width:760px) and (orientation:landscape){.app{grid-template-rows:auto 78vh auto}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* เฉพาะไฟล์นี้ */
[hidden]{display:none!important}
.bottom{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.params{display:grid;gap:calc(var(--u)*.4);align-content:center}
.prow{display:grid;grid-template-columns:minmax(5em,auto) auto minmax(0,5.5em) auto auto;align-items:center;gap:.35em}
.prow .pl{font-family:var(--f-display);font-weight:700;font-size:calc(var(--u)*.95)}
.prow input{width:100%;font-family:var(--f-mono);font-weight:700;font-size:calc(var(--u)*1.1);padding:.15em .3em;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);text-align:right}
.prow .unit{font-family:var(--f-body);color:var(--muted);font-size:calc(var(--u)*.9)}
.mini{font-family:var(--f-display);font-weight:700;font-size:calc(var(--u)*.95);min-width:2em;min-height:1.9em;border-radius:9px;border:1px solid var(--line);background:var(--panel);cursor:pointer}
.mini:disabled{opacity:.35;cursor:default}
.hint2{font-size:calc(var(--u)*.8);color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.calc{font-family:var(--f-mono);font-size:calc(var(--u)*.92);line-height:1.5;overflow:auto;max-height:100%}
.calc .cl{white-space:nowrap}
.calc .res{color:var(--accent);font-weight:700;font-size:1.1em}
.calc .lab{font-family:var(--f-display);font-weight:600;color:var(--muted);font-size:.85em;margin-right:.4em}
.calc .warn{font-family:var(--f-display);font-weight:700;color:#b45309}
.calc .note{font-family:var(--f-body);color:var(--muted)}
@media (max-width:760px){.tools #modeSeg{flex-basis:100%}#modeSeg button{font-size:13px;padding:.35em .3em}.bottom{grid-template-columns:minmax(0,1fr)}.calc{font-size:12.5px}.calc .cl{white-space:normal;overflow-wrap:anywhere}.prow{grid-template-columns:6em auto minmax(0,1fr) auto auto}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="bar">
    <a class="back" href="../">← ห้องทดลอง</a>
    <h1>ตัวเก็บประจุ</h1>
    <div class="tabs" role="tablist" id="tabs">
      <button role="tab" aria-selected="false" data-t="1">① Q = CV และพลังงาน</button>
      <button role="tab" aria-selected="true" data-t="2">② ต่อวงจรเอง</button>
      <button role="tab" aria-selected="false" data-t="3">③ ทรงกลมแตะกัน</button>
    </div>
    <div class="spacer"></div>
    <div class="tools">
      <div class="seg" data-tabs="2" id="modeSeg" role="group" aria-label="เครื่องมือ">
        <button data-m="sel" aria-pressed="true">✋ เลือก/ย้าย</button><button data-m="cap" aria-pressed="false">⊣⊢ ตัวเก็บประจุ</button><button data-m="wire" aria-pressed="false">〰 สายไฟ</button><button data-m="del" aria-pressed="false">✕ ลบ</button>
      </div>
      <div class="seg" data-tabs="2" id="presetSeg" role="group" aria-label="วงจรสำเร็จรูป">
        <button data-p="series" aria-pressed="false">อนุกรม</button><button data-p="parallel" aria-pressed="false">ขนาน</button><button data-p="mixed" aria-pressed="false">ผสม</button>
      </div>
      <button class="btn" data-tabs="2" id="clear">ล้างกระดาน</button>
      <button class="btn" data-tabs="1" id="chg">⚡ ปิดสวิตช์ (ประจุ)</button>
      <button class="btn" data-tabs="3" id="touch">🤝 แตะกัน</button>
      <button class="btn" id="reset">↺ เริ่มใหม่</button>
      <button class="btn" id="fs">⛶ เต็มจอ</button>
    </div>
  </div>

  <div class="panel stage" id="stageBox">
    <canvas id="cv"></canvas>
    <div class="toast" id="toast"></div>
  </div>

  <div class="bottom">
    <div class="panel params" data-tabs="13" id="params13"></div>
    <div class="panel params" data-tabs="2" id="params">
      <span class="label">ปรับค่า</span>
      <div class="prow"><span class="pl">แบตเตอรี่ V</span><button class="mini" id="vM">−</button><input id="vIn" type="number" inputmode="decimal"><button class="mini" id="vP">+</button><span class="unit">V</span></div>
      <div class="prow"><span class="pl" id="cName">ตัวที่เลือก</span><button class="mini" id="cM">−</button><input id="cIn" type="number" inputmode="decimal"><button class="mini" id="cP">+</button><span class="unit">μF</span></div>
      <span class="hint2" id="hint"></span>
    </div>
    <div class="panel"><div class="calc" id="calc"></div></div>
  </div>
</div>

<script>
/* ===================== ตัวช่วย ===================== */
const $=id=>document.getElementById(id);
const SUB={'0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉'};
const sub=s=>String(s).split('').map(c=>SUB[c]||c).join('');
const trimN=s=>s.includes('.')?s.replace(/\.?0+$/,''):s;
const f3=x=>!isFinite(x)?'—':Math.abs(x)<1e-9?'0':trimN(Number(x.toPrecision(3)).toString()).replace('-','−');
let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1800)}

/* ===================== กระดาน ===================== */
const NX=7,NY=4,MAXC=5;
const key=(a,b)=>{if(a[0]>b[0]||(a[0]===b[0]&&a[1]>b[1]))[a,b]=[b,a];return a[0]+','+a[1]+'-'+b[0]+','+b[1]};
const ends=k=>k.split('-').map(s=>s.split(',').map(Number));
const BAT=key([0,1],[0,2]);           // แบตเตอรี่: ขั้ว + ด้านบน (0,1) ขั้ว − ด้านล่าง (0,2)
const S={V:12,els:{},mode:'sel',sel:null,drag:null,ghost:null,wireAt:null,moved:false,res:null,dirty:true};
function resetBoard(){S.els={};S.els[BAT]={t:'bat'};S.sel=null}
function caps(){return Object.entries(S.els).filter(([,e])=>e.t==='cap')}
function nextName(){const used=new Set(caps().map(([,e])=>e.n));for(let i=1;i<=9;i++)if(!used.has(i))return i;return 9}
function wirePath(pts){for(let i=1;i<pts.length;i++){const k=key(pts[i-1],pts[i]);if(!S.els[k])S.els[k]={t:'wire'}}}
function cap(a,b,n,C){S.els[key(a,b)]={t:'cap',n,C}}
const PRESETS={
  series(){resetBoard();S.V=12;wirePath([[0,1],[0,0],[1,0]]);cap([1,0],[2,0],1,3);wirePath([[2,0],[3,0]]);cap([3,0],[4,0],2,6);
    wirePath([[4,0],[5,0],[5,1],[5,2],[5,3],[4,3],[3,3],[2,3],[1,3],[0,3],[0,2]])},
  parallel(){resetBoard();S.V=12;wirePath([[0,1],[0,0],[1,0],[2,0],[3,0],[4,0]]);wirePath([[0,2],[0,3],[1,3],[2,3],[3,3],[4,3]]);
    wirePath([[2,0],[2,1]]);cap([2,1],[2,2],1,4);wirePath([[2,2],[2,3]]);wirePath([[4,0],[4,1]]);cap([4,1],[4,2],2,2);wirePath([[4,2],[4,3]])},
  mixed(){resetBoard();S.V=12;wirePath([[0,1],[0,0],[1,0]]);cap([1,0],[2,0],1,6);wirePath([[2,0],[3,0],[4,0],[5,0]]);
    wirePath([[0,2],[0,3],[1,3],[2,3],[3,3],[4,3],[5,3]]);
    wirePath([[3,0],[3,1]]);cap([3,1],[3,2],2,2);wirePath([[3,2],[3,3]]);wirePath([[5,0],[5,1]]);cap([5,1],[5,2],3,4);wirePath([[5,2],[5,3]])}
};

/* ===================== คำนวณ ===================== */
function solve(){
  // รวมจุดที่ต่อกันด้วยสายไฟ
  const par={},fd=x=>par[x]===undefined||par[x]===x?(par[x]=x):(par[x]=fd(par[x])),un=(a,b)=>{par[fd(a)]=fd(b)};
  for(let i=0;i<NX;i++)for(let j=0;j<NY;j++)par[i+','+j]=i+','+j;
  for(const[k,e]of Object.entries(S.els))if(e.t==='wire'){const[a,b]=ends(k);un(a.join(),b.join())}
  const[bp,bn]=ends(BAT),P=fd(bp.join()),N=fd(bn.join());
  const cs=caps().map(([k,e])=>{const[a,b]=ends(k);return{k,n:e.n,C:e.C,a:fd(a.join()),b:fd(b.join())}});
  const R={P,N,cs,short:P===N,map:{}};
  if(R.short)return R;
  // หาโหนดที่ต่อถึงแบตเตอรี่ผ่านตัวเก็บประจุ
  const adj={};const add=(x,y)=>{(adj[x]=adj[x]||[]).push(y)};cs.forEach(c=>{add(c.a,c.b);add(c.b,c.a)});
  const seen=new Set([P,N]),st=[P,N];while(st.length){const x=st.pop();for(const y of adj[x]||[])if(!seen.has(y)){seen.add(y);st.push(y)}}
  const free=[...seen].filter(x=>x!==P&&x!==N),idx={};free.forEach((x,i)=>idx[x]=i);
  const n=free.length,A=Array.from({length:n},()=>new Array(n+1).fill(0)),Vn={};Vn[P]=S.V;Vn[N]=0;
  for(const c of cs){if(!seen.has(c.a)||c.a===c.b)continue;for(const[x,y]of[[c.a,c.b],[c.b,c.a]]){if(idx[x]===undefined)continue;const i=idx[x];A[i][i]+=c.C;if(idx[y]!==undefined)A[i][idx[y]]-=c.C;else A[i][n]+=c.C*Vn[y]}}
  for(let c=0;c<n;c++){let p=c;for(let r=c+1;r<n;r++)if(Math.abs(A[r][c])>Math.abs(A[p][c]))p=r;[A[c],A[p]]=[A[p],A[c]];const d=A[c][c];if(Math.abs(d)<1e-12)continue;
    for(let r=0;r<n;r++){if(r===c)continue;const f=A[r][c]/d;if(f)for(let k=c;k<=n;k++)A[r][k]-=f*A[c][k]}}
  free.forEach((x,i)=>Vn[x]=Math.abs(A[i][i])<1e-12?0:A[i][n]/A[i][i]);
  let Qt=0;for(const c of cs){const on=seen.has(c.a);c.on=on;c.short=c.a===c.b;const dv=on?(Vn[c.a]??0)-(Vn[c.b]??0):0;c.V=Math.abs(dv);c.Q=c.C*c.V;c.U=.5*c.C*c.V*c.V;c.hiA=dv>=0;
    if(on){if(c.a===P)Qt+=c.C*dv;else if(c.b===P)Qt-=c.C*dv}}
  R.Qt=Qt;R.Ceq=S.V?Qt/S.V:0;R.Vn=Vn;R.steps=reduce(cs.filter(c=>c.on&&!c.short),P,N);
  cs.forEach(c=>R.map[c.k]=c);return R;
}
// ยุบวงจรอนุกรม/ขนานเพื่อแสดงขั้นตอน
function reduce(list,P,N){
  let E=list.map(c=>({a:c.a,b:c.b,C:c.C,ds:String(c.n)})),out=[],guard=0;
  const nm=e=>'C'+sub(e.ds);
  while(guard++<40){let ch=false;
    const deg={};E.forEach(e=>{deg[e.a]=(deg[e.a]||0)+1;deg[e.b]=(deg[e.b]||0)+1});
    // ปลายลอย: ไม่มีประจุ
    for(const e of E){for(const x of[e.a,e.b])if(x!==P&&x!==N&&deg[x]===1){E=E.filter(z=>z!==e);out.push({t:'d',s:nm(e)});ch=true;break}if(ch)break}
    if(ch)continue;
    // ขนาน
    outer:for(let i=0;i<E.length;i++)for(let j=i+1;j<E.length;j++){const e=E[i],f=E[j];if((e.a===f.a&&e.b===f.b)||(e.a===f.b&&e.b===f.a)){
      const g={a:e.a,b:e.b,C:e.C+f.C,ds:[...(e.ds+f.ds)].sort().join('')};out.push({t:'p',s:`${nm(g)} = ${nm(e)} + ${nm(f)} = ${f3(e.C)} + ${f3(f.C)} = ${f3(g.C)} μF  (ขนาน)`});
      E=E.filter(z=>z!==e&&z!==f);E.push(g);ch=true;break outer}}
    if(ch)continue;
    // อนุกรม
    for(const x of Object.keys(deg)){if(x===P||x===N||deg[x]!==2)continue;const two=E.filter(e=>e.a===x||e.b===x);const[e,f]=two;
      const o1=e.a===x?e.b:e.a,o2=f.a===x?f.b:f.a,g={a:o1,b:o2,C:e.C*f.C/(e.C+f.C),ds:[...(e.ds+f.ds)].sort().join('')};
      out.push({t:'s',s:`${nm(g)} = ${nm(e)}${nm(f)}/(${nm(e)} + ${nm(f)}) = (${f3(e.C)})(${f3(f.C)})/(${f3(e.C)} + ${f3(f.C)}) = ${f3(g.C)} μF  (อนุกรม)`});
      E=E.filter(z=>z!==e&&z!==f);E.push(g);ch=true;break}
    if(!ch)break}
  const ok=E.length===1&&((E[0].a===P&&E[0].b===N)||(E[0].a===N&&E[0].b===P));
  return{ok,lines:out}
}

/* ===================== ผัง ===================== */
const cv=$('cv'),ctx=cv.getContext('2d');let W=0,H=0,G={sp:100,ox:0,oy:0};

  for(let i=0;i<nn;i++){const x=Rr-pw/2+pw*(i+.5)/12,rs=u*.42;
    let y=my-gap/2+rs*1.6;ctx.strokeStyle='#d42a2a';ctx.lineWidth=2.2;ctx.beginPath();ctx.moveTo(x-rs,y);ctx.lineTo(x+rs,y);ctx.moveTo(x,y-rs);ctx.lineTo(x,y+rs);ctx.stroke();
    y=my+gap/2-rs*1.6;ctx.strokeStyle='#2557d6';ctx.beginPath();ctx.moveTo(x-rs,y);ctx.lineTo(x+rs,y);ctx.stroke()}
  // แบตเตอรี่
  ctx.strokeStyle='#16232a';ctx.lineWidth=lw*1.2;ctx.beginPath();ctx.moveTo(L-u*1.8,my-u*1.2);ctx.lineTo(L+u*1.8,my-u*1.2);ctx.stroke();ctx.lineWidth=lw*2.2;ctx.beginPath();ctx.moveTo(L-u*.9,my+u*1.2);ctx.lineTo(L+u*.9,my+u*1.2);ctx.stroke();
  font(Math.max(13,u*1.3),700);ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillStyle='#c81e1e';ctx.fillText('+',L+u*2.2,my-u*1.7);ctx.fillStyle='#1d4ed8';ctx.fillText('−',L+u*2.2,my+u*1.7);
  tag('V = '+f3(T1.V)+' V',L+u*3.4,my,'#c2410c','left');
  // สวิตช์
  ctx.fillStyle='#334155';ctx.beginPath();ctx.arc(sx,T,u*.45,0,7);ctx.arc(ex,T,u*.45,0,7);ctx.fill();
  ctx.strokeStyle=T1.on?'#0d6e66':'#c2410c';ctx.lineWidth=lw*1.2;ctx.beginPath();ctx.moveTo(sx,T);if(T1.on)ctx.lineTo(ex,T);else ctx.lineTo(ex-(ex-sx)*.15,T-(ex-sx)*.55);ctx.stroke();
  tag(T1.on?'สวิตช์ปิด':'สวิตช์เปิด',(sx+ex)/2,T+u*2.4,T1.on?'#0d6e66':'#c2410c');
  tag('C = '+f3(T1.C)+' μF',Rr-pw/2-u*.6,my,'#0d6e66','right');
  if(nr)tag('Q = '+f3(q)+' μC · V꜀ = '+f3(T1.v)+' V',(L+Rr)/2,B+u*1.9,'#16232a');
  else{tag('Q = '+f3(q)+' μC',Rr+pw/2+u*.6,my-u*1.1,'#16232a','left');tag('V꜀ = '+f3(T1.v)+' V',Rr+pw/2+u*.6,my+u*1.1,'#16232a','left')}
  // กราฟ Q–V
  const gx0=nr?W*.14:W*.6,gx1=nr?W*.92:W*.95,gy0=nr?H*.94:H*.85,gy1=nr?H*.68:H*.12,Vm=T1.V*1.15||1,Qm=Qmax*1.15;
  const X=v=>gx0+(gx1-gx0)*v/Vm,Y=qq=>gy0-(gy0-gy1)*qq/Qm;
  ctx.strokeStyle='#4d5f64';ctx.lineWidth=1.8;ctx.beginPath();ctx.moveTo(gx0,gy1);ctx.lineTo(gx0,gy0);ctx.lineTo(gx1,gy0);ctx.stroke();
  font(Math.max(12,u*1.05),700);ctx.fillStyle='#4d5f64';ctx.textAlign='left';ctx.textBaseline='bottom';ctx.fillText('Q (μC)',gx0+6,gy1);ctx.textAlign='right';ctx.textBaseline='top';ctx.fillText('V (V)',gx1,gy0+6);
  ctx.setLineDash([6,6]);ctx.strokeStyle='rgba(13,110,102,.5)';ctx.beginPath();ctx.moveTo(X(0),Y(0));ctx.lineTo(X(T1.V),Y(Qmax));ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='rgba(234,179,8,.35)';ctx.beginPath();ctx.moveTo(X(0),Y(0));ctx.lineTo(X(T1.v),Y(q));ctx.lineTo(X(T1.v),Y(0));ctx.closePath();ctx.fill();
  ctx.strokeStyle='#0d6e66';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(X(0),Y(0));ctx.lineTo(X(T1.v),Y(q));ctx.stroke();
  ctx.fillStyle='#0d6e66';ctx.beginPath();ctx.arc(X(T1.v),Y(q),u*.5,0,7);ctx.fill();
  if(q>1e-6)tag('พื้นที่ = U = ½QV = '+f3(.5*q*T1.v)+' μJ',X(T1.v*.62),Y(q*.22),'#8a5d00');
  font(Math.max(11,u*.9),600,'"JetBrains Mono",monospace');ctx.fillStyle='#4d5f64';ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText(f3(T1.V),X(T1.V),gy0+4);ctx.textAlign='right';ctx.textBaseline='middle';ctx.fillText(f3(Qmax),gx0-6,Y(Qmax));
}
function calc1(){const Q=T1.C*T1.V,U=.5*Q*T1.V,q=T1.C*T1.v;
  return `<div class="cl"><span class="lab">ประจุ</span>Q = CV = (${f3(T1.C)} μF)(${f3(T1.V)} V) = <span class="res">${f3(Q)} μC</span></div>
  <div class="cl"><span class="lab">พลังงาน</span>U = ½QV = ½(${f3(Q)})(${f3(T1.V)}) = <span class="res">${f3(U)} μJ</span></div>
  <div class="cl"><span class="lab">สูตรอื่น</span>U = ½CV² = ½(${f3(T1.C)})(${f3(T1.V)})² = ${f3(U)} μJ · U = Q²/2C = (${f3(Q)})²/2(${f3(T1.C)}) = ${f3(U)} μJ</div>
  <div class="cl note">${T1.used?`ขณะนี้ V꜀ = ${f3(T1.v)} V · Q = ${f3(q)} μC · U = ${f3(.5*q*T1.v)} μJ`:'กด ⚡ ปิดสวิตช์ เพื่อประจุ (หรือกด Space)'} · พื้นที่ใต้กราฟ Q–V = พลังงาน</div>`}
$('chg').onclick=()=>{T1.on=!T1.on;T1.used=true;$('chg').textContent=T1.on?'⏏ เปิดสวิตช์':'⚡ ปิดสวิตช์ (ประจุ)';$('chg').classList.toggle('on',T1.on);S.dirty=true};

/* ===================== แท็บ ③: ทรงกลมแตะกัน ===================== */
const KC=9e9;
const T3={a1:10,Q1:-30,a2:20,Q2:0,q1:-30,s:0,touch:false};
function reset3(){Object.assign(T3,{a1:10,Q1:-30,a2:20,Q2:0,q1:-30,s:0,touch:false});syncTouch();renderP13()}
function restart3(){T3.q1=T3.Q1;T3.s=0;T3.touch=false;syncTouch()}
function syncTouch(){$('touch').textContent=T3.touch?'↔ แยกออก':'🤝 แตะกัน';$('touch').classList.toggle('on',T3.touch)}
const tgt1=()=>(T3.Q1+T3.Q2)*T3.a1/(T3.a1+T3.a2);
function step3(dt){const ts=T3.touch?1:0;if(T3.s!==ts){T3.s+=Math.sign(ts-T3.s)*Math.min(Math.abs(ts-T3.s),dt*1.3);S.dirty=true}
  if(T3.touch&&T3.s>=1){const t=tgt1(),d=t-T3.q1;if(Math.abs(d)>.05){T3.q1+=d*Math.min(1,dt*2.6);S.dirty=true;T3.flow=Math.sign(d)}else{if(T3.q1!==t){T3.q1=t;S.dirty=true}T3.flow=0}}else T3.flow=0}
function sphere(x,y,r,q,label,qref,u){
  ctx.fillStyle='#c9a46a';ctx.fillRect(x-u*.5,y+r*.9,u,H*.88-y-r*.9);ctx.fillStyle='#8a6a3a';ctx.beginPath();ctx.ellipse(x,H*.88,u*3,u*.6,0,0,7);ctx.fill();
  const g=ctx.createRadialGradient(x-r*.35,y-r*.4,r*.1,x,y,r);g.addColorStop(0,'#fff');g.addColorStop(.6,'#d5dee1');g.addColorStop(1,'#a7b6bc');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();ctx.strokeStyle='#7d8f95';ctx.lineWidth=2;ctx.stroke();
  const n=Math.min(28,Math.round(Math.abs(q)/qref*14));for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/Math.max(n,1),cx=x+Math.cos(a)*r*.82,cy=y+Math.sin(a)*r*.82,rs=Math.max(4,u*.5);
    if(q>0){ctx.strokeStyle='#d42a2a';ctx.lineWidth=2.2;ctx.beginPath();ctx.moveTo(cx-rs,cy);ctx.lineTo(cx+rs,cy);ctx.moveTo(cx,cy-rs);ctx.lineTo(cx,cy+rs);ctx.stroke()}
    else{ctx.fillStyle='#2557d6';ctx.beginPath();ctx.arc(cx,cy,rs*.9,0,7);ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.8;ctx.beginPath();ctx.moveTo(cx-rs*.5,cy);ctx.lineTo(cx+rs*.5,cy);ctx.stroke()}}
  tag(label,x,y-r-u*2,'#0d6e66');tag('Q = '+f3(q)+' μC',x,y+r+u*2.2,q>0?'#b91c1c':q<0?'#1d4ed8':'#16232a')}
function draw3(){ctx.fillStyle='#f8faf9';ctx.fillRect(0,0,W,H);ctx.fillStyle='#d9d1c2';ctx.fillRect(0,H*.88,W,H*.12);
  const u=Math.max(11,Math.min(W,H*1.7)*.014),k=Math.min(W*.2,H*.26)/Math.max(T3.a1,T3.a2,20),r1=T3.a1*k,r2=T3.a2*k,cy=H*.5;
  const far1=W*.27,far2=W*.73,mid=W*.5,t1=mid-(r1+r2)/2+r1-r1,touch1=mid-(r1+r2)/2,touch2=touch1+r1+r2;
  const x1=far1+(touch1-far1)*T3.s,x2=far2+(touch2-far2)*T3.s,qref=Math.max(Math.abs(T3.Q1),Math.abs(T3.Q2),Math.abs(T3.Q1+T3.Q2),1);
  sphere(x1,cy,r1,T3.q1,'ทรงกลม 1 · a = '+f3(T3.a1)+' cm',qref,u);sphere(x2,cy,r2,T3.Q1+T3.Q2-T3.q1,'ทรงกลม 2 · a = '+f3(T3.a2)+' cm',qref,u);
  if(T3.flow){const ph=(performance.now()/500)%1,cx=x1+r1;for(let i=0;i<3;i++){const t=(ph+i/3)%1,d=T3.flow>0?1:-1,xx=cx+d*(t-.5)*u*6;ctx.fillStyle='#2557d6';ctx.beginPath();ctx.arc(xx,cy,u*.55,0,7);ctx.fill()}
    tag('อิเล็กตรอนไหล '+(T3.flow>0?'1 → 2':'2 → 1'),cx,cy-Math.min(r1,r2)-u*5,'#1d4ed8')}
  if(T3.s>=1)tag(T3.flow?'แตะกัน · ประจุกำลังไหลจนศักย์เท่ากัน':'แตะกัน · ศักย์เท่ากันแล้ว',W/2,H*.94,'#0d6e66')}
function calc3(){const a1=T3.a1/100,a2=T3.a2/100,Q1=T3.Q1*1e-6,Q2=T3.Q2*1e-6,V1=KC*Q1/a1,V2=KC*Q2/a2,St=Q1+Q2,Vc=KC*St/(a1+a2),q1=St*a1/(a1+a2),q2=St-q1;
  return `<div class="cl"><span class="lab">ก่อนแตะ</span>V₁ = KQ₁/a₁ = (9×10⁹)(${fs(Q1)})/(${f3(a1)}) = <b>${fs(V1)} V</b> · V₂ = KQ₂/a₂ = <b>${fs(V2)} V</b></div>
  <div class="cl"><span class="lab">หลักการ</span>หลังแตะ ศักย์เท่ากัน และประจุรวมคงที่ ΣQ = ${f3(T3.Q1)} + (${f3(T3.Q2)}) = ${f3(T3.Q1+T3.Q2)} μC</div>
  <div class="cl"><span class="lab">หลังแตะ</span>V = KΣQ/(a₁ + a₂) = (9×10⁹)(${fs(St)})/(${f3(a1)} + ${f3(a2)}) = <span class="res">${fs(Vc)} V</span></div>
  <div class="cl"><span class="lab">แบ่งประจุ</span>Q₁′ = ΣQ·a₁/(a₁ + a₂) = <span class="res">${f3(q1*1e6)} μC</span> · Q₂′ = ΣQ·a₂/(a₁ + a₂) = <span class="res">${f3(q2*1e6)} μC</span></div>
  <div class="cl note">ทรงกลมใหญ่ได้ประจุมากกว่า (ประจุแบ่งตามรัศมี) · ประจุที่ย้าย = ${f3(Math.abs(q1*1e6-T3.Q1))} μC</div>`}
$('touch').onclick=()=>{T3.touch=!T3.touch;syncTouch();S.dirty=true};

/* ===================== แผงปรับค่าแท็บ ①③ ===================== */
const SP13={1:[['C','ความจุ C','μF',1,.5,100,T1],['V','แรงดัน V','V',1,1,500,T1]],
  3:[['a1','รัศมีทรงกลม 1','cm',1,1,50,T3],['Q1','ประจุทรงกลม 1','μC',1,-200,200,T3],['a2','รัศมีทรงกลม 2','cm',1,1,50,T3],['Q2','ประจุทรงกลม 2','μC',1,-200,200,T3]]};
function renderP13(){if(S.tab===2)return;$('params13').innerHTML='<span class="label">ปรับค่า</span>'+SP13[S.tab].map(([k,l,u,,,,o])=>`<div class="prow"><span class="pl">${l}</span><button class="mini" data-k="${k}" data-d="-1">−</button><input data-k="${k}" type="number" inputmode="decimal" value="${o[k]}"><button class="mini" data-k="${k}" data-d="1">+</button><span class="unit">${u}</span></div>`).join('')}
function set13(k,v){const sp=SP13[S.tab].find(x=>x[0]===k);if(!sp)return;v=Math.max(sp[4],Math.min(sp[5],Math.round(v/sp[3]*2)/2*sp[3]));sp[6][k]=v;
  const i=document.querySelector(`#params13 input[data-k="${k}"]`);if(i&&document.activeElement!==i)i.value=v;if(S.tab===3)restart3();S.dirty=true}
$('params13').addEventListener('click',e=>{const b=e.target.closest('button[data-k]');if(!b)return;const sp=SP13[S.tab].find(x=>x[0]===b.dataset.k);set13(b.dataset.k,sp[6][b.dataset.k]+sp[3]*+b.dataset.d)});
$('params13').addEventListener('input',e=>{const i=e.target.closest('input[data-k]');if(!i)return;const v=parseFloat(i.value);if(isFinite(v))set13(i.dataset.k,v)});

/* ===================== รวม ===================== */
S.tab=2;
function showTabs(){document.querySelectorAll('[data-tabs]').forEach(el=>el.hidden=!el.dataset.tabs.includes(String(S.tab)))}
function setTab(t){S.tab=t;document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',+b.dataset.t===t));showTabs();renderP13();layout()}
function draw(){if(!W)return;if(S.tab===1)draw1();else if(S.tab===3)draw3();else draw2()}
function calc(){$('calc').innerHTML=S.tab===1?calc1():S.tab===3?calc3():(calc2(),$('calc').innerHTML)}
let tp=performance.now();
function loop(t){const dt=Math.min(.05,(t-tp)/1000);tp=t;if(W){if(S.tab===1)step1(dt);if(S.tab===3){step3(dt);if(T3.flow)S.dirty=true}}
  if(S.dirty&&W){S.dirty=false;draw();if(S.tab===2){calc2();editor()}else $('calc').innerHTML=S.tab===1?calc1():calc3()}requestAnimationFrame(loop)}
PRESETS.mixed();update();showTabs();layout();requestAnimationFrame(loop);
</script>
</body>
