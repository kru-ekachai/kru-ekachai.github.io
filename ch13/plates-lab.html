<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ห้องทดลองสนามไฟฟ้าสม่ำเสมอ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Sarabun:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* ทีวี/คอม: พอดีจอเดียว · โทรศัพท์: ภาพบน ปุ่มล่าง */
:root{
  --f-display:"Chakra Petch","Sarabun",system-ui,sans-serif;
  --f-body:"Sarabun",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --u:clamp(13px,1.9vh,40px);
  --bg:#e9eeec; --panel:#f8faf9; --ink:#16232a; --muted:#4d5f64; --line:#c3cfcd;
  --accent:#0d6e66; --accent-ink:#fff;
  --pos:#d42a2a; --neg:#2557d6; --ask:#c98a04; --metal1:#eef2f3; --metal2:#9fb0b6;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden}
body{font-family:var(--f-body);font-size:var(--u);line-height:1.4;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
.app{height:100vh;height:100dvh;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;gap:calc(var(--u)*.6);
  padding:calc(var(--u)*.7) calc(var(--u)*1) calc(var(--u)*.7 + env(safe-area-inset-bottom))}

/* แถบบน */
.bar{display:flex;align-items:center;gap:calc(var(--u)*.6);flex-wrap:wrap}
.back{font-family:var(--f-display);font-weight:600;font-size:calc(var(--u)*.8);color:var(--accent);text-decoration:none;opacity:.85;white-space:nowrap}
h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:calc(var(--u)*1.4);white-space:nowrap}
.tabs{display:flex;gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{font-family:var(--f-display);font-weight:600;font-size:calc(var(--u)*.85);border:0;background:transparent;color:var(--muted);
  padding:.3em .7em;border-radius:9px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.tabs button[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.spacer{flex:1}
.tools{display:flex;gap:calc(var(--u)*.45);flex-wrap:wrap;align-items:center}
.btn{font-family:var(--f-display);font-weight:600;font-size:calc(var(--u)*.95);padding:.35em .8em;border-radius:10px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);cursor:pointer;white-space:nowrap;min-height:2.3em}
.btn:disabled{opacity:.4;cursor:default}
.btn.on{border-color:var(--accent);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:#e3f1ef}
.btn:focus-visible,.tabs button:focus-visible,.seg button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg button{white-space:nowrap;font-family:var(--f-display);font-weight:700;font-size:calc(var(--u)*.95);padding:.35em .75em;border:0;background:var(--panel);color:var(--muted);cursor:pointer;min-height:2.3em}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"].p{background:var(--pos);color:#fff}
.seg button[aria-pressed="true"].n{background:var(--neg);color:#fff}

/* เวที */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;min-width:0;min-height:0;position:relative;overflow:hidden}
.stage canvas{display:block;width:100%;height:100%;touch-action:none}
.toast{position:absolute;bottom:.8em;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.35em .9em;border-radius:999px;
  font-size:calc(var(--u)*.85);opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:.92}

/* ส่วนล่าง */
.bottom{display:grid;grid-template-columns:minmax(0,2.6fr) minmax(0,1fr);gap:calc(var(--u)*.6)}
.bottom .panel{padding:calc(var(--u)*.6) calc(var(--u)*.9);display:grid;gap:calc(var(--u)*.35);align-content:center}
.label{font-family:var(--f-display);font-weight:600;font-size:calc(var(--u)*.75);letter-spacing:.06em;color:var(--muted)}
.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.3em .9em;margin:0}
.nums div{display:grid}
.nums dt{font-size:calc(var(--u)*.78);color:var(--muted)}
.nums dd{margin:0;font-family:var(--f-display);font-weight:700;font-size:calc(var(--u)*1.1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nums .cnt{font-family:var(--f-mono);font-size:calc(var(--u)*1.4)}
.nums .big dd{font-family:var(--f-mono);font-size:calc(var(--u)*1.5)}
.nums .big dd small{font-family:var(--f-body);font-weight:500;font-size:.5em;color:var(--muted);margin-left:.4em}
.legend{display:grid;gap:.4em;font-size:calc(var(--u)*.85)}
.legend span{display:flex;align-items:center;gap:.5em}
.legend b{display:inline-grid;place-items:center;width:1.3em;height:1.3em;border-radius:50%;font-family:var(--f-mono);font-size:.95em;flex:none}
.lp{color:var(--pos);border:1.5px solid var(--pos)}
.ln{background:var(--neg);color:#fff}


/* แท็บ */
[hidden]{display:none!important}
.seg button[aria-pressed="true"].g{background:var(--accent);color:#fff}
.otab{width:100%;border-collapse:collapse;font-size:calc(var(--u)*.9)}
.otab th{font-family:var(--f-display);font-weight:600;font-size:calc(var(--u)*.8);color:var(--muted);text-align:right;padding:0 .5em .15em}
.otab th:first-child,.otab td:first-child{text-align:left;padding-left:0}
.otab td{font-family:var(--f-mono);font-weight:700;font-size:calc(var(--u)*1.1);text-align:right;padding:.05em .5em;white-space:nowrap}
.otab td:first-child{font-family:var(--f-display);font-weight:600;font-size:calc(var(--u)*.95)}
.otab .cp{color:var(--pos)}.otab .cn{color:var(--neg)}
.otab tr.sum td{border-top:1px solid var(--line);padding-top:.15em}
/* หน้าจอเล็ก (คอมจอเล็ก) */
@media (max-width:1600px) and (min-width:761px){h1{display:none}}
/* โทรศัพท์ / แท็บเล็ตแนวตั้ง */
@media (max-width:760px){
  :root{--u:15px}
  html,body{overflow:auto;height:auto}
  .app{height:auto;min-height:100dvh;grid-template-rows:auto 52vh auto;padding:10px 10px calc(10px + env(safe-area-inset-bottom))}
  .bar{gap:8px}
  h1{font-size:18px;flex:1}
  .tabs{order:3;width:100%}
  .spacer{display:none}
  .tools{order:4;width:100%}
  .tools .btn{flex:1 1 auto;padding:.35em .5em;font-size:14px}
  .tools .seg{flex:1 1 auto}.tools .seg button{flex:1}
  .bottom{grid-template-columns:minmax(0,1fr);gap:8px}
  .bottom .legendbox{display:none}
  .nums{grid-template-columns:repeat(2,minmax(0,1fr))}
  .nums .big{grid-column:1/-1}
}
@media (max-width:760px) and (orientation:landscape){.app{grid-template-rows:auto 78vh auto}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* เฉพาะไฟล์นี้ */
[hidden]{display:none!important}
.bottom{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.params{display:grid;gap:calc(var(--u)*.35);align-content:center}
.prow{display:grid;grid-template-columns:minmax(4.5em,auto) auto minmax(0,5.5em) auto minmax(0,1fr);align-items:center;gap:.35em}
.prow .pl{font-family:var(--f-display);font-weight:600;font-size:calc(var(--u)*.9)}
.prow input{width:100%;font-family:var(--f-mono);font-weight:700;font-size:calc(var(--u)*1.05);padding:.15em .3em;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);text-align:right}
.prow .unit{font-family:var(--f-body);color:var(--muted);font-size:calc(var(--u)*.85);white-space:nowrap}
.mini{font-family:var(--f-display);font-weight:700;font-size:calc(var(--u)*.95);min-width:2em;min-height:1.9em;border-radius:9px;border:1px solid var(--line);background:var(--panel);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.calc{font-family:var(--f-mono);font-size:calc(var(--u)*.95);line-height:1.55;overflow:auto;max-height:100%}
.calc .cl{white-space:nowrap}
.calc .res{color:var(--accent);font-weight:700;font-size:1.12em}
.calc .lab{font-family:var(--f-display);font-weight:600;color:var(--muted);font-size:.85em;margin-right:.4em}
.calc .note{font-family:var(--f-body);color:var(--muted)}
.calc .ok{font-family:var(--f-display);font-weight:700;color:#15803d}
.vslide{position:absolute;left:4%;right:4%;bottom:.7em;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:.8em;
  background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:14px;padding:.45em .9em;z-index:2}
.vslide .vl{font-family:var(--f-display);font-weight:600;font-size:calc(var(--u)*.9);color:var(--muted)}
.vslide b{font-family:var(--f-mono);font-size:calc(var(--u)*1.35);color:var(--accent);min-width:5.5ch;text-align:right}
.vslide .track{position:relative;height:calc(var(--u)*2)}
.vslide input{position:absolute;inset:0;width:100%;height:100%;margin:0;accent-color:var(--accent);cursor:pointer}
.vslide i{position:absolute;top:-.35em;bottom:-.35em;width:4px;margin-left:-2px;background:#15803d;border-radius:2px;pointer-events:none}
.vslide i::after{content:"สมดุล";position:absolute;top:-1.5em;left:50%;transform:translateX(-50%);font-style:normal;font-family:var(--f-display);font-weight:700;font-size:calc(var(--u)*.75);color:#15803d;white-space:nowrap}
@media (max-width:760px){.vslide{left:2%;right:2%;bottom:.4em;gap:.5em;grid-template-columns:minmax(0,1fr) auto}.vslide .vl{display:none}.bottom{grid-template-columns:minmax(0,1fr)}.calc{font-size:12.5px}.calc .cl{white-space:normal;overflow-wrap:anywhere}.prow{grid-template-columns:5.5em auto minmax(0,1fr) auto auto}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="bar">
    <a class="back" href="../">← ห้องทดลอง</a>
    <h1>สนามไฟฟ้าสม่ำเสมอ</h1>
    <div class="tabs" role="tablist" id="tabs">
      <button role="tab" aria-selected="true" data-t="1">① ความต่างศักย์และงาน</button>
      <button role="tab" aria-selected="false" data-t="2">② ประจุเคลื่อนที่ในสนาม</button>
      <button role="tab" aria-selected="false" data-t="3">③ มิลลิแกน / ลูกพิธ</button>
    </div>
    <div class="spacer"></div>
    <div class="tools">
      <div class="seg" data-tabs="2" id="partSeg" role="group" aria-label="ชนิดอนุภาค">
        <button data-p="e" aria-pressed="true">อิเล็กตรอน</button><button data-p="p" aria-pressed="false">โปรตอน</button><button data-p="c" aria-pressed="false">กำหนดเอง</button>
      </div>
      <button class="btn" data-tabs="2" id="shoot">➜ ยิงแนวนอน</button>
      <button class="btn" data-tabs="2" id="drop">● ปล่อยจากหยุดนิ่ง</button>
      <div class="seg" data-tabs="3" id="modeSeg" role="group" aria-label="รูปแบบ">
        <button data-m="oil" aria-pressed="true">หยดน้ำมัน</button><button data-m="pend" aria-pressed="false">ลูกพิธแขวนด้าย</button>
      </div>
      <button class="btn" data-tabs="3" id="tickBtn">ขีดจุดสมดุล</button>
      <button class="btn" id="reset">↺ เริ่มใหม่</button>
      <button class="btn" id="fs">⛶ เต็มจอ</button>
    </div>
  </div>

  <div class="panel stage" id="stageBox">
    <canvas id="cv"></canvas>
    <div class="toast" id="toast"></div>
    <div class="vslide" id="vslide" hidden>
      <span class="vl">ความต่างศักย์</span>
      <div class="track"><input type="range" id="vRange" min="0" max="200" step="0.5" aria-label="ความต่างศักย์ (โวลต์)"><i id="vTick" hidden></i></div>
      <b id="vVal">0 V</b>
    </div>
  </div>

  <div class="bottom">
    <div class="panel params" id="params"></div>
    <div class="panel"><div class="calc" id="calc"></div></div>
  </div>
</div>

<script>
/* ===================== ตัวช่วย ===================== */
const $=id=>document.getElementById(id);
const E_CH=1.6e-19, M_E=9.1e-31, M_P=1.67e-27, G=10;
const SUP={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹'};
const sup=n=>String(n).split('').map(c=>SUP[c]||c).join('');
const trimN=s=>s.includes('.')&&!s.includes('e')?s.replace(/\.?0+$/,''):s;
function fmt(x,sig=3){
  if(!isFinite(x))return '—';if(x===0)return '0';
  let e=Math.floor(Math.log10(Math.abs(x))),m=Number((x/Math.pow(10,e)).toPrecision(sig));
  if(Math.abs(m)>=10){m/=10;e++}
  if(e>=-2&&e<=3)return trimN(Number(x.toPrecision(sig)).toString()).replace('-','−');
  return trimN(m.toPrecision(sig)).replace('-','−')+'×10'+sup(e);
}
let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1700)}

/* ===================== สถานะ ===================== */
function defaults(){return{
  1:{V:8,d:1,q:2,A:{x:-.3,y:-.25},B:{x:.3,y:.25}},           // ข้อ 54: E = 8 V/m, AB = 0.5 m
  2:{V:100,d:2,v0:10,p:'e',cq:2,cm:4,run:null,trail:[]},   // d เป็น cm · v0 เป็น ×10⁶ m/s
  3:{mode:'oil',V:60,d:.8,m:9.6,n:5,y:.5,                   // ข้อ 59: d 0.8 cm, E 12000 V/m, q 8×10⁻¹⁹ C
     pV:6,pd:10,pq:2.5,pm:.015,th:0,tick:false}                         // ข้อ 67: q 2.5 μC, m 0.015 g → E 60 N/C
}}
let S={tab:1,st:defaults(),drag:null,dirty:true};
const T=()=>S.st[S.tab];

/* ===================== แผงปรับค่า ===================== */
const SPECS={
  1:[['V','ความต่างศักย์ V','V',1,1,1000],['d','ระยะห่างแผ่น d','m',.1,.2,5],['q','ประจุทดสอบ q','μC',1,-100,100]],
  2:[['V','ความต่างศักย์ V','V',10,10,2000],['d','ระยะห่างแผ่น d','cm',.5,1,5],['v0','ความเร็วยิง v₀','×10⁶ m/s',1,0,50]],
  '2c':[['cq','ประจุ (เท่าของ e)','e',1,-10,10],['cm','มวล (เท่าของโปรตอน)','mₚ',1,1,100]],
  oil:[['V','ความต่างศักย์ V','V',1,0,1000],['d','ระยะห่างแผ่น d','cm',.1,.2,5],['m','มวลหยดน้ำมัน','×10⁻¹⁶ kg',.1,.1,100],['n','อิเล็กตรอนเกิน','ตัว',1,1,50]],
  pend:[['pV','ความต่างศักย์ V','V',1,0,500],['pd','ระยะห่างแผ่น d','cm',1,2,50],['pq','ประจุลูกพิธ','μC',.5,-20,20],['pm','มวลลูกพิธ','g',.005,.005,1]]
};
function specs(){if(S.tab===3)return SPECS[T().mode];if(S.tab===2)return T().p==='c'?SPECS[2].concat(SPECS['2c']):SPECS[2];return SPECS[1]}
function renderParams(){
  const st=T();$('params').innerHTML='<span class="label">ปรับค่า</span>'+specs().map(([k,l,u])=>`<div class="prow"><span class="pl">${l}</span><button class="mini" data-k="${k}" data-d="-1" aria-label="ลด">−</button><input data-k="${k}" type="number" inputmode="decimal" value="${+st[k].toFixed(4)}"><button class="mini" data-k="${k}" data-d="1" aria-label="เพิ่ม">+</button><span class="unit">${u}</span></div>`).join('');
}
function setParam(k,v){const sp=specs().find(s=>s[0]===k);if(!sp)return;v=Math.max(sp[4],Math.min(sp[5],v));v=Math.round(v/sp[3])*sp[3];v=+v.toFixed(4);
  if(k==='q'&&v===0)v=sp[3];if(k==='cq'&&v===0)v=1;T()[k]=v;const inp=document.querySelector(`#params input[data-k="${k}"]`);if(inp&&document.activeElement!==inp)inp.value=v;
  if(S.tab===2){T().run=null;T().trail=[]}clampAB();S.dirty=true}
$('params').addEventListener('click',e=>{const b=e.target.closest('button[data-k]');if(!b)return;const sp=specs().find(s=>s[0]===b.dataset.k);setParam(b.dataset.k,T()[b.dataset.k]+sp[3]*+b.dataset.d)});
$('params').addEventListener('input',e=>{const i=e.target.closest('input[data-k]');if(!i)return;const v=parseFloat(i.value);if(isFinite(v))setParam(i.dataset.k,v)});
$('params').addEventListener('change',e=>{const i=e.target.closest('input[data-k]');if(i)i.value=T()[i.dataset.k]});

/* ===================== ผังเวที ===================== */
const cv=$('cv'),ctx=cv.getContext('2d');let W=0,H=0,Vw={};
function layout(){const r=cv.getBoundingClientRect(),D=devicePixelRatio||1;W=r.width;H=r.height;cv.width=W*D;cv.height=H*D;ctx.setTransform(D,0,0,D,0,0);S.dirty=true}
new ResizeObserver(layout).observe(cv);
function font(px,w=600,fam='"Chakra Petch","Sarabun",sans-serif'){ctx.font=`${w} ${px}px ${fam}`}
const U=()=>Math.max(12,Math.min(W,H*1.6)*.016);
function arrow(x1,y1,x2,y2,col,w=4){const L=Math.hypot(x2-x1,y2-y1);if(L<2)return;const ux=(x2-x1)/L,uy=(y2-y1)/L,h=Math.min(L*.5,Math.max(9,w*3));
  ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=w;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2-ux*h*.8,y2-uy*h*.8);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-ux*h-uy*h*.55,y2-uy*h+ux*h*.55);ctx.lineTo(x2-ux*h+uy*h*.55,y2-uy*h-ux*h*.55);ctx.closePath();ctx.fill()}
function tag(text,x,y,col,side=1){font(Math.max(13,U()*1.05),700);const w=ctx.measureText(text).width+12,h=Math.max(20,U()*1.6);
  let bx=side<0?x-w-6:x+6,by=y-h/2;bx=Math.max(4,Math.min(W-w-4,bx));by=Math.max(4,Math.min(H-h-4,by));
  ctx.fillStyle='rgba(255,255,255,.93)';ctx.strokeStyle=col;ctx.lineWidth=1.5;ctx.beginPath();ctx.roundRect(bx,by,w,h,6);ctx.fill();ctx.stroke();
  ctx.fillStyle=col;ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(text,bx+6,by+h/2+1)}
function sym(x,y,r,s){
  if(s>0){ctx.strokeStyle='#d42a2a';ctx.lineWidth=Math.max(1.8,r*.32);ctx.beginPath();ctx.moveTo(x-r*.6,y);ctx.lineTo(x+r*.6,y);ctx.moveTo(x,y-r*.6);ctx.lineTo(x,y+r*.6);ctx.stroke()}
  else{ctx.strokeStyle='#2557d6';ctx.lineWidth=Math.max(1.8,r*.32);ctx.beginPath();ctx.moveTo(x-r*.6,y);ctx.lineTo(x+r*.6,y);ctx.stroke()}}
// แผ่นคู่ขนานแนวนอน: บน + ล่าง −
function platesH(x0,x1,yt,yb,showEq,V){
  const th=Math.max(10,U()*.9);
  ctx.fillStyle='#e9d2d2';ctx.strokeStyle='#b91c1c';ctx.lineWidth=1.5;ctx.beginPath();ctx.roundRect(x0,yt-th,x1-x0,th,3);ctx.fill();ctx.stroke();
  ctx.fillStyle='#d3dcf2';ctx.strokeStyle='#1d4ed8';ctx.beginPath();ctx.roundRect(x0,yb,x1-x0,th,3);ctx.fill();ctx.stroke();
  const n=Math.max(4,Math.round((x1-x0)/(U()*3.2)));
  for(let i=0;i<n;i++){const x=x0+(x1-x0)*(i+.5)/n;sym(x,yt-th/2,th*.42,1);sym(x,yb+th/2,th*.42,-1)}

function oil(){const st=T(),d=st.d/100,E=st.V/d,q=st.n*E_CH,m=st.m*1e-16,mg=m*G,qE=q*E;return{d,E,q,m,mg,qE,net:qE-mg,Vb:mg*d/q}}

$('partSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const st=S.st[2];st.p=b.dataset.p;st.run=null;st.trail=[];
  if(st.p==='p'&&st.v0>5)st.v0=1;if(st.p==='e'&&st.v0<5)st.v0=10;syncSegs();renderParams();S.dirty=true});
$('vRange').addEventListener('input',e=>{const st=S.st[3],o=oil3(),mx=+e.target.max;let v=+e.target.value;if(Math.abs(v-o.Vb)<mx*.02)v=+o.Vb.toFixed(2);st.V=v;
  const inp=document.querySelector('#params input[data-k="V"]');if(inp)inp.value=v;S.dirty=true});
$('tickBtn').onclick=()=>{S.st[3].tick=!S.st[3].tick;S.dirty=true};
$('modeSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;S.st[3].mode=b.dataset.m;syncSegs();renderParams();S.dirty=true});

// ลาก A, B (แท็บ ①)
function pt(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function hit1(p){if(S.tab!==1)return null;const g=geo1(),st=T();for(const k of['A','B']){const q=w1(g,st[k]);if(Math.hypot(p.x-q.x,p.y-q.y)<Math.max(22,U()*1.8))return k}return null}
cv.addEventListener('pointerdown',e=>{const k=hit1(pt(e));if(!k)return;S.drag=k;cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing'});
cv.addEventListener('pointermove',e=>{const p=pt(e);if(!S.drag){cv.style.cursor=hit1(p)?'grab':'default';return}
  const g=geo1(),st=T(),sn=v=>Math.round(v*20)/20;const o=st[S.drag];o.x=sn((p.x-g.cx)/g.sc);o.y=sn((g.cy-p.y)/g.sc);clampAB();S.dirty=true});
const end=()=>{S.drag=null;cv.style.cursor='default'};cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;const k=e.key;
  if(k>='1'&&k<='3')setTab(+k);else if(k==='r'||k==='R')$('reset').click();else if(k==='f'||k==='F')$('fs').click();
  else if(k===' '&&S.tab===2){e.preventDefault();launch(T().v0>0?'shoot':'drop')}});

let tp=performance.now();
function loop(t){const dt=Math.min(.05,(t-tp)/1000);tp=t;if(W){if(S.tab===2)step2(dt);if(S.tab===3)step3(dt)}
  if(S.dirty&&W){S.dirty=false;draw();calc()}requestAnimationFrame(loop)}
showTabs();syncSegs();renderParams();layout();requestAnimationFrame(loop);
</script>
