<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ฟิล์มบางและวงแหวนนิวตัน</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Sarabun:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* ทีวี/คอม: พอดีจอเดียว · โทรศัพท์: ภาพบน ปุ่มล่าง */
:root{
  --f-display:"Chakra Petch","Sarabun",system-ui,sans-serif;
  --f-body:"Sarabun",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --u:clamp(13px,1.9vh,40px);
  --bg:#e9eeec; --panel:#f8faf9; --ink:#16232a; --muted:#4d5f64; --line:#c3cfcd;
  --accent:#0d6e66; --accent-ink:#fff;
  --pos:#d42a2a; --neg:#2557d6; --ask:#c98a04; --metal1:#eef2f3; --metal2:#9fb0b6;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden}
body{font-family:var(--f-body);font-size:var(--u);line-height:1.4;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
.app{height:100vh;height:100dvh;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;gap:calc(var(--u)*.6);
  padding:calc(var(--u)*.7) calc(var(--u)*1) calc(var(--u)*.7 + env(safe-area-inset-bottom))}

/* แถบบน */
.bar{display:flex;align-items:center;gap:calc(var(--u)*.6);flex-wrap:wrap}
.back{font-family:var(--f-display);font-weight:600;font-size:calc(var(--u)*.8);color:var(--accent);text-decoration:none;opacity:.85;white-space:nowrap}
h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:calc(var(--u)*1.4);white-space:nowrap}
.tabs{display:flex;gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{font-family:var(--f-display);font-weight:600;font-size:calc(var(--u)*.85);border:0;background:transparent;color:var(--muted);
  padding:.3em .7em;border-radius:9px;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.tabs button[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.spacer{flex:1}
.tools{display:flex;gap:calc(var(--u)*.45);flex-wrap:wrap;align-items:center}
.btn{font-family:var(--f-display);font-weight:600;font-size:calc(var(--u)*.95);padding:.35em .8em;border-radius:10px;border:1px solid var(--line);
  background:var(--panel);color:var(--ink);cursor:pointer;white-space:nowrap;min-height:2.3em}
.btn:disabled{opacity:.4;cursor:default}
.btn.on{border-color:var(--accent);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:#e3f1ef}
.btn:focus-visible,.tabs button:focus-visible,.seg button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.seg button{white-space:nowrap;font-family:var(--f-display);font-weight:700;font-size:calc(var(--u)*.95);padding:.35em .75em;border:0;background:var(--panel);color:var(--muted);cursor:pointer;min-height:2.3em}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"].p{background:var(--pos);color:#fff}
.seg button[aria-pressed="true"].n{background:var(--neg);color:#fff}

/* เวที */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;min-width:0;min-height:0;position:relative;overflow:hidden}
.stage canvas{display:block;width:100%;height:100%;touch-action:none}
.toast{position:absolute;bottom:.8em;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.35em .9em;border-radius:999px;
  font-size:calc(var(--u)*.85);opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:.92}

/* ส่วนล่าง */
.bottom{display:grid;grid-template-columns:minmax(0,2.6fr) minmax(0,1fr);gap:calc(var(--u)*.6)}
.bottom .panel{padding:calc(var(--u)*.6) calc(var(--u)*.9);display:grid;gap:calc(var(--u)*.35);align-content:center}
.label{font-family:var(--f-display);font-weight:600;font-size:calc(var(--u)*.75);letter-spacing:.06em;color:var(--muted)}
.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.3em .9em;margin:0}
.nums div{display:grid}
.nums dt{font-size:calc(var(--u)*.78);color:var(--muted)}
.nums dd{margin:0;font-family:var(--f-display);font-weight:700;font-size:calc(var(--u)*1.1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nums .cnt{font-family:var(--f-mono);font-size:calc(var(--u)*1.4)}
.nums .big dd{font-family:var(--f-mono);font-size:calc(var(--u)*1.5)}
.nums .big dd small{font-family:var(--f-body);font-weight:500;font-size:.5em;color:var(--muted);margin-left:.4em}
.legend{display:grid;gap:.4em;font-size:calc(var(--u)*.85)}
.legend span{display:flex;align-items:center;gap:.5em}
.legend b{display:inline-grid;place-items:center;width:1.3em;height:1.3em;border-radius:50%;font-family:var(--f-mono);font-size:.95em;flex:none}
.lp{color:var(--pos);border:1.5px solid var(--pos)}
.ln{background:var(--neg);color:#fff}


/* แท็บ */
[hidden]{display:none!important}
.seg button[aria-pressed="true"].g{background:var(--accent);color:#fff}
.otab{width:100%;border-collapse:collapse;font-size:calc(var(--u)*.9)}
.otab th{font-family:var(--f-display);font-weight:600;font-size:calc(var(--u)*.8);color:var(--muted);text-align:right;padding:0 .5em .15em}
.otab th:first-child,.otab td:first-child{text-align:left;padding-left:0}
.otab td{font-family:var(--f-mono);font-weight:700;font-size:calc(var(--u)*1.1);text-align:right;padding:.05em .5em;white-space:nowrap}
.otab td:first-child{font-family:var(--f-display);font-weight:600;font-size:calc(var(--u)*.95)}
.otab .cp{color:var(--pos)}.otab .cn{color:var(--neg)}
.otab tr.sum td{border-top:1px solid var(--line);padding-top:.15em}
/* หน้าจอเล็ก (คอมจอเล็ก) */
@media (max-width:1600px) and (min-width:761px){h1{display:none}}
/* โทรศัพท์ / แท็บเล็ตแนวตั้ง */
@media (max-width:760px){
  :root{--u:15px}
  html,body{overflow:auto;height:auto}
  .app{height:auto;min-height:100dvh;grid-template-rows:auto 52vh auto;padding:10px 10px calc(10px + env(safe-area-inset-bottom))}
  .bar{gap:8px}
  h1{font-size:18px;flex:1}
  .tabs{order:3;width:100%}
  .spacer{display:none}
  .tools{order:4;width:100%}
  .tools .btn{flex:1 1 auto;padding:.35em .5em;font-size:14px}
  .tools .seg{flex:1 1 auto}.tools .seg button{flex:1}
  .bottom{grid-template-columns:minmax(0,1fr);gap:8px}
  .bottom .legendbox{display:none}
  .nums{grid-template-columns:repeat(2,minmax(0,1fr))}
  .nums .big{grid-column:1/-1}
}
@media (max-width:760px) and (orientation:landscape){.app{grid-template-rows:auto 78vh auto}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* เฉพาะไฟล์นี้ */
[hidden]{display:none!important}
.bottom{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.params{display:grid;gap:calc(var(--u)*.4);align-content:center}
.prow{display:grid;grid-template-columns:minmax(5em,auto) auto minmax(0,5.5em) auto auto;align-items:center;gap:.35em}
.prow .pl{font-family:var(--f-display);font-weight:700;font-size:calc(var(--u)*.95)}
.prow input{width:100%;font-family:var(--f-mono);font-weight:700;font-size:calc(var(--u)*1.1);padding:.15em .3em;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);text-align:right}
.prow .unit{font-family:var(--f-body);color:var(--muted);font-size:calc(var(--u)*.9)}
.mini{font-family:var(--f-display);font-weight:700;font-size:calc(var(--u)*.95);min-width:2em;min-height:1.9em;border-radius:9px;border:1px solid var(--line);background:var(--panel);cursor:pointer}
.mini:disabled{opacity:.35;cursor:default}
.hint2{font-size:calc(var(--u)*.8);color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.calc{font-family:var(--f-mono);font-size:calc(var(--u)*.92);line-height:1.5;overflow:auto;max-height:100%}
.calc .cl{white-space:nowrap}
.calc .res{color:var(--accent);font-weight:700;font-size:1.1em}
.calc .lab{font-family:var(--f-display);font-weight:600;color:var(--muted);font-size:.85em;margin-right:.4em}
.calc .warn{font-family:var(--f-display);font-weight:700;color:#b45309}
.calc .note{font-family:var(--f-body);color:var(--muted)}
@media (max-width:760px){.tools #modeSeg{flex-basis:100%}#modeSeg button{font-size:13px;padding:.35em .3em}.bottom{grid-template-columns:minmax(0,1fr)}.calc{font-size:12.5px}.calc .cl{white-space:normal;overflow-wrap:anywhere}.prow{grid-template-columns:6em auto minmax(0,1fr) auto auto}}
.calc .warn,.calc .cl{white-space:normal}
.calc .ok{font-family:var(--f-display);font-weight:700;color:#15803d}
.prange{width:100%;accent-color:var(--accent);margin:0 0 .2em}
.params{gap:calc(var(--u)*.15)!important}
.nuc{display:inline-flex;align-items:center;white-space:nowrap}.nuc .az{display:inline-flex;flex-direction:column;align-items:flex-end;line-height:.95;font-size:.62em;margin-right:.08em}.nuc .az sup,.nuc .az sub{vertical-align:baseline;position:static}
.calc table{border-collapse:collapse;font-size:.95em;margin:.15em 0}.calc td,.calc th{padding:.05em .9em .05em 0;text-align:left;white-space:nowrap}.calc th{font-family:var(--f-display);font-weight:600;color:var(--muted);font-size:.85em}
.calc tr.hit td{color:#15803d;font-weight:700}

@media (max-width:760px){.calc td{white-space:normal!important}}
@media (max-width:760px) and (orientation:portrait){.app{grid-template-rows:auto 56vh auto}}
.seg{flex-wrap:wrap}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="bar">
    <a class="back" href="../">← ห้องทดลอง</a>
    <h1>ฟิล์มบางและวงแหวนนิวตัน</h1>
    <div class="tabs" role="tablist" id="tabs"><button role="tab" aria-selected="true" data-t="1">① การเปลี่ยนเฟส</button><button role="tab" aria-selected="false" data-t="2">② ฟิล์มบาง</button><button role="tab" aria-selected="false" data-t="3">③ วงแหวนนิวตัน</button></div>
    <div class="spacer"></div>
    <div class="tools"><button class="btn" id="reset">↺ เริ่มใหม่</button><button class="btn" id="fs">⛶ เต็มจอ</button></div>
  </div>
  <div class="panel stage" id="stageBox"><canvas id="cv"></canvas><div class="toast" id="toast"></div></div>
  <div class="bottom">
    <div class="panel params" id="params"></div>
    <div class="panel"><div class="calc" id="calc"></div></div>
  </div>
</div>
<script>
/* ===================== ตัวช่วยร่วม ===================== */
const $=id=>document.getElementById(id);
const trimN=s=>s.includes('.')?s.replace(/\.?0+$/,''):s;
const f3=x=>!isFinite(x)?'—':Math.abs(x)<1e-12?'0':trimN(Number(x.toPrecision(3)).toString()).replace('-','−');
const fN=(x,d)=>(Math.round(x*10**d)/10**d).toFixed(d).replace('-','−');
const SUPd={'-':'⁻','0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','+':'⁺'};
const SUBd={'0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉'};
const sup=s=>String(s).split('').map(c=>SUPd[c]||c).join(''),sub=s=>String(s).split('').map(c=>SUBd[c]||c).join('');
function fs(x){if(!isFinite(x))return '—';if(Math.abs(x)<1e-40)return '0';let e=Math.floor(Math.log10(Math.abs(x))),m=Number((x/Math.pow(10,e)).toPrecision(3));if(Math.abs(m)>=10){m/=10;e++}
  if(e>=-2&&e<=4)return f3(x);return trimN(m.toPrecision(3)).replace('-','−')+'×10'+sup(e)}
let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200)}
let lastCalc='';const setCalc=h=>{if(h!==lastCalc){lastCalc=h;$('calc').innerHTML=h}};
const cv=$('cv'),ctx=cv.getContext('2d');let W=0,H=0;
function layout(){const r=cv.getBoundingClientRect(),D=devicePixelRatio||1;W=r.width;H=r.height;cv.width=W*D;cv.height=H*D;ctx.setTransform(D,0,0,D,0,0);S.dirty=true}
new ResizeObserver(()=>layout()).observe(cv);
const UU=()=>Math.max(11,Math.min(W,H*1.7)*.014);
function font(px,w=600,fam='"Chakra Petch","Sarabun",sans-serif'){ctx.font=`${w} ${px}px ${fam}`}
function tag(text,x,y,col,ax='center'){font(Math.max(12,UU()*1.05),700);const w=ctx.measureText(text).width+12,h=Math.max(19,UU()*1.65);
  let bx=ax==='center'?x-w/2:ax==='left'?x:x-w,by=y-h/2;bx=Math.max(3,Math.min(W-w-3,bx));by=Math.max(3,Math.min(H-h-3,by));
  ctx.fillStyle='rgba(255,255,255,.95)';ctx.strokeStyle=col;ctx.lineWidth=1.5;ctx.beginPath();ctx.roundRect(bx,by,w,h,6);ctx.fill();ctx.stroke();
  ctx.fillStyle=col;ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(text,bx+6,by+h/2+1)}
function arrow(x1,y1,x2,y2,col,lw=3){const a=Math.atan2(y2-y1,x2-x1),h=Math.max(8,lw*3.2);ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=lw;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2-Math.cos(a)*h*.6,y2-Math.sin(a)*h*.6);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-h*Math.cos(a-.45),y2-h*Math.sin(a-.45));ctx.lineTo(x2-h*Math.cos(a+.45),y2-h*Math.sin(a+.45));ctx.closePath();ctx.fill()}
function wave(x1,y1,x2,y2,col,u,lp){const L=Math.hypot(x2-x1,y2-y1);if(L<2)return;const a=Math.atan2(y2-y1,x2-x1),A=u*.42;lp=lp||u*1.1;
  ctx.save();ctx.translate(x1,y1);ctx.rotate(a);ctx.strokeStyle=col;ctx.lineWidth=2.4;ctx.beginPath();for(let s=0;s<=L;s+=1.2)ctx.lineTo(s,A*Math.sin(2*Math.PI*s/lp)*Math.min(1,s/(lp*.6),(L-s)/(lp*.6)));ctx.stroke();ctx.restore()}
/* สัญลักษณ์นิวไคลด์ ᴬ_Z X */
function nucSym(x,y,A,Z,X,size,col='#0f172a',ax='center'){font(size,700);const wX=ctx.measureText(X).width;font(size*.5,700,'"JetBrains Mono",monospace');const wn=Math.max(ctx.measureText(String(A)).width,ctx.measureText(String(Z)).width);
  const tw=wn+3+wX;let x0=ax==='center'?x-tw/2:ax==='left'?x:x-tw;ctx.fillStyle=col;ctx.textAlign='right';ctx.textBaseline='alphabetic';
  ctx.fillText(String(A),x0+wn,y-size*.38);ctx.fillText(String(Z),x0+wn,y+size*.12);font(size,700);ctx.textAlign='left';ctx.fillText(X,x0+wn+3,y+size*.12);return tw}
const nucTxt=(A,Z,X)=>`<span class="nuc"><span class="az"><sup>${A}</sup><sub>${Z}</sub></span>${X}</span>`;
/* ปุ่มกลุ่ม (seg) */
function segSync(id,attr,val){document.querySelectorAll('#'+id+' button').forEach(b=>b.setAttribute('aria-pressed',b.dataset[attr]===String(val)))}
function segOn(id,fn){$(id).addEventListener('click',e=>{const b=e.target.closest('button');if(b)fn(b)})}
/* แผงปรับค่าทั่วไป: [key,label,unit,step,min,max,obj] */
let SPEC=[];
function renderParams(spec,hint=''){SPEC=spec;$('params').innerHTML='<span class="label">ปรับค่า</span>'+spec.map(([k,l,u,st,a,b,o])=>`<div class="prow"><span class="pl">${l}</span><button class="mini" data-k="${k}" data-d="-1">−</button><input data-k="${k}" type="number" inputmode="decimal" value="${o[k]}"><button class="mini" data-k="${k}" data-d="1">+</button><span class="unit">${u}</span></div><input class="prange" type="range" data-r="${k}" min="${a}" max="${b}" step="${st}" value="${o[k]}" aria-label="${l}">`).join('')+(hint?`<span class="hint2">${hint}</span>`:'')}
function setParam(k,v){const sp=SPEC.find(x=>x[0]===k);if(!sp)return;v=Math.max(sp[4],Math.min(sp[5],Math.round(v/sp[3])*sp[3]));v=+v.toFixed(4);sp[6][k]=v;
  const i=document.querySelector(`#params input[data-k="${k}"]`);if(i&&document.activeElement!==i)i.value=v;const r=document.querySelector(`#params input[data-r="${k}"]`);if(r&&document.activeElement!==r)r.value=v;S.dirty=true;if(typeof onParam==='function')onParam(k)}
$('params').addEventListener('click',e=>{const b=e.target.closest('button[data-k]');if(!b)return;const sp=SPEC.find(x=>x[0]===b.dataset.k);setParam(b.dataset.k,sp[6][b.dataset.k]+sp[3]*(+b.dataset.d))});
$('params').addEventListener('input',e=>{const i=e.target.closest('input[data-k],input[data-r]');if(!i)return;const v=parseFloat(i.value);if(isFinite(v))setParam(i.dataset.k||i.dataset.r,v)});
$('params').addEventListener('change',e=>{const i=e.target.closest('input[data-k]');if(i){const sp=SPEC.find(x=>x[0]===i.dataset.k);if(sp)i.value=sp[6][i.dataset.k]}});
$('fs').onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen?.()};
function showTabs(t){document.querySelectorAll('[data-tabs]').forEach(el=>el.hidden=!el.dataset.tabs.includes(String(t)))}

const FM={soap:['ฟองสบู่ (อากาศ / น้ำสบู่ / อากาศ)',1,1.33,1],oil:['คราบน้ำมันบนน้ำ (อากาศ / น้ำมัน / น้ำ)',1,1.45,1.33],coat:['เคลือบเลนส์ (อากาศ / MgF₂ / แก้ว)',1,1.38,1.5]};
const DEF={tab:1,run:true,fm:'soap',t:300,lam:550,R:2,lamN:600,m:3};

/* ===================== ตัวช่วยร่วมสำหรับแล็บแสง ===================== */
const RC='#dc2626',RC2='#f97316',NC='#64748b',MC='#475569',IC='#2563eb',GU='#fca5a5',TC='#0d6e66';
const R2D=180/Math.PI,D2R=Math.PI/180;
const T={...DEF};
const S={dirty:true,drag:null};
function ray(x1,y1,x2,y2,col,dash,arw,lw=3){ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.setLineDash(dash?[8,6]:[]);ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.setLineDash([]);
  if(arw){const mx=x1+(x2-x1)*.55,my=y1+(y2-y1)*.55,a=Math.atan2(y2-y1,x2-x1),L=12;ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(mx+Math.cos(a)*L*.6,my+Math.sin(a)*L*.6);ctx.lineTo(mx+Math.cos(a+2.5)*L*.6,my+Math.sin(a+2.5)*L*.6);ctx.lineTo(mx+Math.cos(a-2.5)*L*.6,my+Math.sin(a-2.5)*L*.6);ctx.closePath();ctx.fill()}}
function arcAng(cx,cy,r,a0,a1,col,lab,u){ctx.strokeStyle=col;ctx.lineWidth=2;ctx.beginPath();let d=a1-a0;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;ctx.arc(cx,cy,r,a0,a0+d,d<0);ctx.stroke();if(lab){const am=a0+d/2;tag(lab,cx+Math.cos(am)*(r+u*2.4),cy+Math.sin(am)*(r+u*2.4),col)}}
function dashLine(x1,y1,x2,y2,col,lw=2){ray(x1,y1,x2,y2,col,true,false,lw)}
function dot(x,y,r,col){ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()}
function txt(s,x,y,col,px,al='center',bl='middle',w=700){font(px,w);ctx.fillStyle=col;ctx.textAlign=al;ctx.textBaseline=bl;ctx.fillText(s,x,y)}
/* ---------- อนิเมชันทีละขั้น ---------- */
const A={p:99,tg:99,N:6,last:0,spd:1.25};
function replay(){A.p=0;A.tg=99;S.dirty=true}
function instant(){A.p=99;S.dirty=true}

  for(let i=-2;i<=2;i++){const x=mx+i*sc*.35;ray(x,H*.1,x,sy-curv*(x-mx)**2,lamCol(T.lamN),false,i===0,2)}txt('แสงสีเดียว',mx,H*.08,lamCol(T.lamN),Math.max(12,u),'center','bottom');
  tag('จุดกลางมืด เพราะชั้นอากาศหนา ≈ 0 และแสงสะท้อนที่ผิวแก้วด้านล่างเปลี่ยนเฟส 180°',W/2,H-u*1.4,'#0d6e66')}
function draw(){T.tab===1?draw1():T.tab===2?draw2():draw3()}
/* ===================== แผงล่าง ===================== */
function calc(){const t=T.tab;
  if(t===1)return `<div class="cl"><span class="lab">การเปลี่ยนเฟสเมื่อสะท้อน</span>แสงจากตัวกลาง n น้อย → n มาก: คลื่นสะท้อนมีเฟสเปลี่ยน 180° · แสงจากตัวกลาง n มาก → n น้อย: คลื่นสะท้อนไม่เปลี่ยนเฟส</div><div class="cl note">เทียบได้กับคลื่นในเชือก: ปลายตรึง → กลับเฟส · ปลายอิสระ → ไม่กลับเฟส · ความยาวคลื่นในตัวกลาง λₙ = λ/n</div>`;
  if(t===2){const f=FM[T.fm],k=flips(),n=f[2],p=2*n*T.t;let h=`<div class="cl"><span class="lab">${f[0]}</span>ระยะทางต่างกัน 2nt = 2 × ${n} × ${T.t} = ${fN(p,0)} nm · เฟสเปลี่ยนจากการสะท้อน ${k} ครั้ง</div>`;
    h+=k%2?`<div class="cl"><span class="lab">เงื่อนไข (เปลี่ยนเฟส 1 ครั้ง)</span>เสริมกัน 2nt = (m − ½)λ · หักล้างกัน 2nt = mλ</div>`:`<div class="cl"><span class="lab">เงื่อนไข (เปลี่ยนเฟส ${k} ครั้ง)</span>เสริมกัน 2nt = mλ · หักล้างกัน 2nt = (m − ½)λ</div>`;
    const I=reflI(T.lam);h+=`<div class="cl"><span class="lab">แสง λ = ${T.lam} nm</span>2nt/λ = ${fN(p/T.lam,2)} → <span class="res">${I>.85?'เสริมกัน':I<.15?'หักล้างกัน':'เสริม/หักล้างบางส่วน'}</span></div>`;
    if(T.fm==='coat')h+=`<div class="cl note">ความหนาน้อยที่สุดที่ไม่สะท้อนแสง λ: t = λ/4n = ${T.lam}/(4 × ${n}) = ${fN(T.lam/(4*n),1)} nm</div>`;return h}
  const lam=T.lamN*1e-9,r=Math.sqrt(T.m*T.R*lam)*1e3;return `<div class="cl"><span class="lab">วงมืด</span>2t = mλ และ t ≈ r²/2R → r² = mRλ</div><div class="cl"><span class="lab">วงมืดที่ m = ${T.m}</span>r = √(mRλ) = √(${T.m} × ${T.R} × ${T.lamN}×10⁻⁹) = <span class="res">${fN(r,2)} mm</span></div><div class="cl note">วงสว่าง: r² = (m − ½)Rλ · วงยิ่งห่างจากจุดกลางยิ่งชิดกัน · ใช้ตรวจความสมบูรณ์ของผิวเลนส์</div>`}
/* ===================== แผงปรับค่า ===================== */
function renderP(){const t=T.tab;
  if(t===1)return finishP(`<span class="label">คลื่น</span>${segH('s1','run',[[true,'▶ เคลื่อนที่'],[false,'⏸ หยุด']])}`,[]);
  if(t===2)return finishP(`<span class="label">ชนิดฟิล์ม</span>${segH('s2','fm',[['soap','ฟองสบู่'],['oil','คราบน้ำมัน'],['coat','เคลือบเลนส์']])}`+prow('t','ความหนาฟิล์ม t','nm')+prow('lam','ความยาวคลื่น λ','nm')+(T.fm==='coat'?`<div class="seg" id="qSeg"><button data-q="1">ตั้งความหนา t = λ/4n</button></div>`:'')+`<span class="label">คลื่น</span>${segH('s3','run',[[true,'▶ เคลื่อนที่'],[false,'⏸ หยุด']])}`,[['t','','',5,0,1000,T],['lam','','',10,400,700,T]]);
  finishP(prow('R','รัศมีความโค้ง R','m')+prow('lamN','ความยาวคลื่น λ','nm')+prow('m','วงมืดที่ m','')+'<span class="hint2">กดบนภาพวงแหวนเพื่อเลือกวงมืด</span>',[['R','','',.5,1,5,T],['lamN','','',10,400,700,T],['m','','',1,1,12,T]])}
$('params').addEventListener('click',e=>{if(e.target.closest('#qSeg button')){T.t=Math.round(T.lam/(4*FM.coat[2]));syncInputs();S.dirty=true}});
function dragStart(p){if(T.tab===3){const cx=W*.7,cy=H*.5,Rp=Math.min(W*.27,H*.44),r=Math.hypot(p.x-cx,p.y-cy);if(r<Rp){T.m=Math.max(1,Math.min(12,Math.round((r/Rp)**2*12)));syncInputs();S.dirty=true}}if(T.tab===2){const px=W*.63,py=H*.12,ph=H*.62;if(p.x>px&&p.x<px+W*.2&&p.y>py&&p.y<py+ph)return 'th'}return null}
function dragMove(p){if(S.drag==='th'){T.t=Math.max(0,Math.min(1000,Math.round((p.y-H*.12)/(H*.62)*1000/5)*5));S.dirty=true}}

start();
</script>
